<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบขอหนังสือรับรองสิทธิการรักษา (Firebase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>

<div class="max-w-5xl mx-auto mt-10 p-4">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-800">ระบบขอหนังสือรับรองสิทธิการรักษา</h1>
        <p class="text-gray-600 mt-2">เชื่อมต่อฐานข้อมูล Firebase Firestore</p>
    </div>
    <div id="app-content" class="bg-white p-8 rounded-xl shadow-lg"></div>
</div>

<!-- ใช้ type="module" สำหรับ Firebase v9+ -->
<script type="module">
    // 1. นำเข้า Firebase Functions ที่จำเป็น
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. ใส่ Config ของโปรเจกต์คุณ (ได้มาตอนสร้างโปรเจกต์ในเว็บ Firebase)
    const firebaseConfig = {
        aapiKey: "AIzaSyC6wWCb37Rz4l47b-BgTSVCUMR5XoGYgYM",
  authDomain: "dgnew-workletter.firebaseapp.com",
  projectId: "dgnew-workletter",
  storageBucket: "dgnew-workletter.firebasestorage.app",
  messagingSenderId: "295974995832",
  appId: "1:295974995832:web:06c3563609186a39b76a8d",
  measurementId: "G-P35XBS1YNV"
    };

    // 3. เริ่มต้นการเชื่อมต่อ
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- ฟังก์ชันดึงข้อมูลและบันทึกข้อมูล (แทน LocalStorage เดิม) ---
    
    // ฟังก์ชันดึงข้อมูลทั้งหมดจาก Firestore
    async function fetchRequestsFromDB() {
        const querySnapshot = await getDocs(collection(db, "medicalRequests"));
        let requests = [];
        querySnapshot.forEach((doc) => {
            requests.push({ docId: doc.id, ...doc.data() }); // เก็บ doc.id ไว้ใช้อัปเดตสถานะ
        });
        return requests;
    }

    // กำหนดให้ฟังก์ชันทำงานผ่าน HTML (เพราะ type="module" จะแยก Scope)
    window.navigate = function(page) {
        const appDiv = document.getElementById('app-content');
        if (page === 'home') appDiv.innerHTML = renderHome();
        else if (page === 'new-request') appDiv.innerHTML = renderNewRequest();
        // ... (หน้าอื่นๆ โค้ด HTML เหมือนเดิมเป๊ะ ผมขอละไว้เพื่อให้กระชับ) ...
    };

    // ฟังก์ชันยื่นคำขอใหม่ (บันทึกลง Firebase)
    window.submitRequest = async function(e) {
        e.preventDefault();
        const fullName = document.getElementById('fullName').value;
        const relation = document.getElementById('relation').value;
        const reason = document.getElementById('reason').value;
        const reqId = 'REQ' + Date.now().toString().slice(-6);
        
        try {
            // ใช้ addDoc เพื่อเพิ่มเอกสารใหม่ลงใน Collection "medicalRequests"
            await addDoc(collection(db, "medicalRequests"), {
                id: reqId,
                fullName: fullName,
                relation: relation,
                reason: reason,
                status: 'รอดำเนินการ',
                date: new Date().toLocaleDateString('th-TH')
            });
            alert(`ยื่นคำขอสำเร็จ!\nเลขที่อ้างอิงของคุณคือ: ${reqId}`);
            window.navigate('home');
        } catch (error) {
            console.error("Error adding document: ", error);
            alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
        }
    };

    // ฟังก์ชันค้นหาสถานะ (ดึงจาก Firebase)
    window.searchStatus = async function() {
        const query = document.getElementById('searchName').value.trim();
        const resDiv = document.getElementById('searchResult');
        if (!query) { resDiv.innerHTML = '<p class="text-red-500">กรุณาพิมพ์ชื่อ</p>'; return; }

        resDiv.innerHTML = '<p class="text-blue-500">กำลังค้นหาข้อมูล...</p>'; // โชว์สถานะโหลด
        
        const requests = await fetchRequestsFromDB();
        const results = requests.filter(r => r.fullName.includes(query));
        
        if (results.length === 0) { resDiv.innerHTML = '<p class="text-gray-500">ไม่พบข้อมูลคำขอ</p>'; return; }

        let html = '<ul class="space-y-3">';
        results.forEach(r => {
            html += `<li class="border p-4 rounded shadow-sm">
                        <p class="font-bold">เลขที่: ${r.id}</p>
                        <p>ชื่อ: ${r.fullName}</p>
                        <p>สถานะ: <span class="font-semibold text-blue-600">${r.status}</span></p>
                     </li>`;
        });
        html += '</ul>';
        resDiv.innerHTML = html;
    };

    // ฟังก์ชัน HR อนุมัติ (อัปเดตข้อมูลใน Firebase)
    window.approveRequest = async function(docId) {
        try {
            const requestRef = doc(db, "medicalRequests", docId);
            await updateDoc(requestRef, {
                status: "อนุมัติแล้ว"
            });
            alert("อัปเดตสถานะเป็น 'อนุมัติแล้ว' สำเร็จ");
            window.navigate('hr-dashboard'); // รีเฟรชหน้า HR
        } catch (error) {
            console.error("Error updating document: ", error);
        }
    };

    // จำลองฟังก์ชัน render ต่างๆ (โค้ด HTML เหมือนข้อความก่อนหน้า)
    function renderHome() { return `...โค้ด HTML หน้าแรก...`; }
    function renderNewRequest() { return `...โค้ด HTML หน้าฟอร์ม...`; }

    // เริ่มต้นแอป
    window.navigate('home');
</script>
</body>
</html>
